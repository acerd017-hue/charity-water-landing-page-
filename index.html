
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Help bring clean, safe drinking water to children and communities."
  >

  <title>One Drop, One Childhood Saved | Charity: Water</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">

      <div class="hero-overlay"></div>

      <div class="hero-content">
        <p class="eyebrow">Every drop makes a difference</p>

        <h1 id="hero-title">
          ONE DROP, ONE<br>
          CHILDHOOD SAVED
        </h1>

        <p class="hero-description">
          Make others smile with clean water.
          Donate now to help spread the love
          of healthy drinking water.
        </p>

        <a
          class="donate-button"
          href="https://www.charitywater.org/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Help Bring Clean Water <span aria-hidden="true">↗</span>
        </a>
      </div>

      <footer class="hero-footer">
        <p class="creator">
          Angelina Cerda<br>
          <span>10/8/26</span>
        </p>

        <a
          class="brand"
          href="https://www.charitywater.org/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit the charity: water website"
        >
          <span class="water-icon" aria-hidden="true">♜</span>
          <span class="brand-name">charity: water</span>
          <span class="brand-tagline">SMALL CHANGE. BIG IMPACT.</span>
        </a>
      </footer>

    </section>
  </main>
</body>
</html>
